<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDÚRIL HUBBLE // FORJA PERSONAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { 
            --bg-dark: #080312; --bg-panel: #120624; 
            --neon-purple: #a855f7; --neon-cyan: #00e5ff; 
            --neon-green: #00ff88; --neon-red: #ff2a6d; 
            --text-main: #e6e2f0; --text-muted: #8b7fa3; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; }
        body, html { height: 100vh; width: 100vw; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }
        
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        /* HEADER */
        .header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: rgba(18, 6, 36, 0.95); border-bottom: 1px solid rgba(168,85,247,0.2); z-index: 2000; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-box { background: var(--neon-purple); color: #fff; font-weight: 900; padding: 5px 10px; border-radius: 4px; }
        .logo-text { font-size: 16px; font-family: 'Rajdhani'; font-weight: 700; letter-spacing: 1px; }
        
        .nav-toggle { display: flex; gap: 8px; }
        .nav-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 6px 14px; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.2s; letter-spacing: 1px; }
        .nav-btn:hover { border-color: var(--neon-purple); color: var(--neon-purple); }
        .nav-btn.active { background: rgba(168,85,247,0.1); border-color: var(--neon-purple); color: #fff; }
        .btn-shutdown { border-color: var(--neon-red); color: var(--neon-red); }

        .status-bar { display: flex; align-items: center; gap: 15px; font-size: 11px; font-weight: bold; }
        .live-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); animation: blink 1.5s infinite; display: inline-block; margin-right: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* SIDEBAR */
        .sidebar { width: 320px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid rgba(168,85,247,0.2); display: flex; flex-direction: column; overflow: hidden; z-index: 1500; }
        .panel-header { padding: 12px; font-size: 10px; border-bottom: 1px solid rgba(168,85,247,0.1); display: flex; justify-content: space-between; background: rgba(168,85,247,0.05); }
        .panel-header span { color: var(--neon-purple); font-weight: bold; }
        #device-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .device-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(168,85,247,0.1); border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .device-item:hover { background: rgba(168,85,247,0.1); border-color: var(--neon-purple); }
        .device-item.active { background: rgba(168,85,247,0.15); border-left: 3px solid var(--neon-purple); }
        .dev-title { display: flex; justify-content: space-between; font-family: 'Rajdhani'; font-size: 14px; font-weight: 700; color: #fff; }
        .dev-title.online { color: var(--neon-green); }
        .dev-coords { display: flex; justify-content: space-between; font-size: 9px; color: var(--neon-cyan); margin-top: 4px; }
        .dev-stats { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); margin-top: 6px; border-top: 1px solid rgba(168,85,247,0.1); padding-top: 4px; }

        /* MAPA */
        #map-container { flex: 1; position: relative; background: #05030a; }
        #map { width: 100%; height: 100%; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%) saturate(0.8); }
        
        /* Limpiamos los divIcon de Leaflet */
        .leaflet-div-icon { background: transparent !important; border: none !important; box-shadow: none !important; }

        /* PANEL INFO */
        .info-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 0; overflow: hidden; background: var(--bg-panel); border-left: 1px solid var(--neon-purple); transition: width 0.3s; z-index: 1800; box-shadow: -5px 0 20px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
        .info-panel.open { width: 360px; }
        .info-content { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .stat-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(168,85,247,0.2); padding: 10px; border-radius: 6px; }
        .stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-value { font-family: 'Rajdhani'; font-size: 18px; font-weight: 700; color: var(--neon-cyan); }

        .btn-action { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.2s; text-transform: uppercase; margin-top: 5px; }
        .btn-action:hover { background: rgba(168,85,247,0.2); color: #fff; }
        .btn-orange { border-color: #ffb800; color: #ffb800; }
        .btn-alert { border-color: var(--neon-red); color: var(--neon-red); }

        /* ALERTAS */
        #alert-container { position: absolute; top: 15px; right: 380px; z-index: 2500; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .alert-box { background: rgba(255,42,109,0.9); border-left: 4px solid #fff; color: #fff; padding: 12px; border-radius: 6px; font-size: 11px; box-shadow: 0 4px 15px rgba(255,42,109,0.4); min-width: 250px; pointer-events: auto; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 60px; bottom: 0; left: 0; width: 85vw; transform: translateX(-105%); transition: 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .info-panel { position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100% !important; height: 65vh; border-left: none; border-top: 1px solid var(--neon-purple); border-radius: 20px 20px 0 0; transform: translateY(110%); transition: 0.3s; }
            .info-panel.open { transform: translateY(0); }
            .nav-toggle { display: none; }
        }
    
        .search-area { padding: 10px; border-bottom: 1px solid rgba(168,85,247,0.1); }
        .search-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(168,85,247,0.3); color: #fff; padding: 8px; border-radius: 4px; font-size: 11px; outline: none; }
        .search-input:focus { border-color: var(--neon-purple); }
        .filter-group { display: flex; gap: 5px; margin-top: 8px; }
        .filter-btn { flex: 1; background: transparent; border: 1px solid rgba(168,85,247,0.3); color: var(--text-muted); font-size: 9px; padding: 4px; border-radius: 4px; cursor: pointer; }
        .filter-btn.active { background: rgba(168,85,247,0.2); color: #fff; border-color: var(--neon-purple); }
    </style>
</head>
<body>
<div id="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-box">AH</div>
            <div class="logo-text">ANDÚRIL HUBBLE</div>
        </div>
        <div class="nav-toggle">
            <button class="nav-btn active">MAPA</button>
            <button class="nav-btn btn-shutdown" onclick="alert('Usa PM2 para apagar')">â» APAGAR</button>
        </div>
        <div class="status-bar">
            <div><span class="live-dot"></span><span id="api-status" style="color:var(--neon-green);">ONLINE</span></div>
            <div id="clock" style="color:var(--neon-purple);">00:00:00</div>
        </div>
    </header>

    <main class="main-content">
        <aside class="sidebar" id="sidebar">
            <div class="panel-header">
                <span>FLOTA // <span id="kpi-total">0</span></span>
                <span style="color:var(--neon-green);"><span id="kpi-online">0</span> ACTIVOS</span>
            </div>
            
                <div class="search-area">
                    <input type="text" class="search-input" id="search-input" placeholder="ðŸ” Buscar unidad..." oninput="filterList()">
                    <div class="filter-group">
                        <button class="filter-btn active" onclick="setFilter('all', event)">TODOS</button>
                        <button class="filter-btn" onclick="setFilter('sms', event)">SMS</button>
                        <button class="filter-btn" onclick="setFilter('hubble', event)">HUBBLE</button>
                        <button class="filter-btn" onclick="setFilter('scraping', event)">TGL</button>
                    </div>
                </div>
                <div id="device-list"></div>
        </aside>

        <div id="map-container">
            <div id="map"></div>
        </div>

        <aside class="info-panel" id="info-panel">
            <div class="info-content">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="color:var(--neon-cyan); font-family:'Rajdhani'; margin:0;" id="info-title">UNIDAD</h2>
                    <button onclick="closePanel()" style="background:none; border:none; color:var(--neon-red); font-size:16px; cursor:pointer;">âœ–</button>
                </div>
                <div id="info-data" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>
        </aside>
    </main>
</div>
<div id="alert-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API = window.location.origin;
    const HEADERS = {}; // Sin key en frontend. El frontend es publico, cualquier key aqui la lee cualquiera. La auth va en el servidor.
    let allPositions = [];

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString() + ' MX'; }, 1000);

    const map = L.map('map', { zoomControl: false }).setView([23.6345, -102.5528], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    
    const markers = {};
    const onlineIcon = L.divIcon({ html:'<div style="background:#00ff66;width:16px;height:16px;border-radius:50%;box-shadow:0 0 15px #00ff66;border:2px solid #fff;"></div>', iconSize:[16,16], iconAnchor:[8,8] });
    const offlineIcon = L.divIcon({ html:'<div style="background:#ff0055;width:16px;height:16px;border-radius:50%;box-shadow:0 0 15px #ff0055;border:2px solid #fff;"></div>', iconSize:[16,16], iconAnchor:[8,8] });

    
    let filteredPositions = [];
    let currentSourceFilter = 'all';
    let currentSearch = '';

    function setFilter(source, evt) {
        currentSourceFilter = source;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if(evt && evt.target) evt.target.classList.add('active');
        filterList();
    }

    function filterList() {
        currentSearch = document.getElementById('search-input').value.toLowerCase();
        filteredPositions = allPositions.filter(p => {
            const srcMatch = (currentSourceFilter === 'all') || ((p.fuente || 'sms').toLowerCase() === currentSourceFilter);
            const id = (p.dispositivo_id || p.mid || '').toLowerCase();
            const name = (p.nombre || '').toLowerCase();
            return srcMatch && (id.includes(currentSearch) || name.includes(currentSearch));
        });
        renderList();
        updateMap();
    }

    function closePanel() { document.getElementById('info-panel').classList.remove('open'); }

    async function loadPositions() { 
        try { 
            const r = await fetch(`${API}/api/posiciones/latest`, {headers:HEADERS}); 
            const j = await r.json(); 
            allPositions = Array.isArray(j) ? j : (j.rows || []); 
            filterList(); 
            updateMap();
        } catch(e){ document.getElementById('api-status').innerText='OFFLINE'; } 
    }

    function renderList() { 
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        document.getElementById('device-list').innerHTML = filteredPositions.map(p => {
            const id = p.dispositivo_id || p.mid;
            const isOnline = ((new Date() - new Date(p.timestamp))/1000/60) < 15;
            return `
                <div class="device-item" onclick="focusDevice('${id}')">
                    <div class="dev-title ${isOnline?'online':''}"><span>${esc(p.nombre || id)}</span> <span>${isOnline?'ON':'OFF'}</span></div>
                    <div class="dev-coords"><span>LAT: ${Number(p.lat).toFixed(4)}</span><span>LON: ${Number(p.lon).toFixed(4)}</span></div>
                    <div class="dev-stats"><span>VEL: ${p.velocidad || 0} km/h</span><span>TEMP: ${p.temperatura || '--'}°C</span></div>
                </div>`;
        }).join('');
        document.getElementById('kpi-total').textContent = allPositions.length;
        document.getElementById('kpi-online').textContent = allPositions.filter(p => ((new Date() - new Date(p.timestamp))/1000/60) < 15).length;
    }

    function updateMap() {
        filteredPositions.forEach(p => {
            const id = p.dispositivo_id || p.mid;
            const isOnline = ((new Date() - new Date(p.timestamp))/1000/60) < 15;
            const latlng = [Number(p.lat), Number(p.lon)];
            
            if (markers[id]) { markers[id].setLatLng(latlng).setIcon(isOnline ? onlineIcon : offlineIcon); }
            else {
                markers[id] = L.marker(latlng, {icon: isOnline ? onlineIcon : offlineIcon})
                .addTo(map)
                .on('click', () => focusDevice(id));
            }
        });
    }

    function focusDevice(id) {
        const p = allPositions.find(x => (x.dispositivo_id || x.mid) === id); if(!p) return; 
        map.setView([Number(p.lat), Number(p.lon)], 15); 
        
        document.getElementById('info-panel').classList.add('open');
        document.getElementById('info-title').innerText = p.nombre || id; // innerText ya es seguro, no usar innerHTML con datos
        
        const isOnline = ((new Date() - new Date(p.timestamp))/1000/60) < 15;
        document.getElementById('info-data').innerHTML = `
            <div class="stat-box">
                <div class="stat-label">Estado</div>
                <div class="stat-value" style="color:${isOnline?'var(--neon-green)':'var(--neon-red)'}">${isOnline?'ONLINE':'OFFLINE'}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Temperatura</div>
                <div class="stat-value" style="color:${p.temperatura > 8 ? 'var(--neon-red)' : 'var(--neon-cyan)'}">${p.temperatura || '--'} °C</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Coordenadas</div>
                <div style="font-size:11px; color:var(--neon-cyan); margin-top:4px;">LAT: ${Number(p.lat).toFixed(6)}<br>LON: ${Number(p.lon).toFixed(6)}</div>
            </div>
            
            <button class="btn-action btn-orange" onclick="requestGpsUpdate('${id}')">ðŸ“¡ SOLICITAR ESTATUS REAL</button>
            <button class="btn-action btn-alert" onclick="showAlert('Alerta enviada a ${id}')">ðŸš¨ ENVIAR ALERTA</button>
        `;
    }

    async function requestGpsUpdate(id) {
        const p = allPositions.find(x => (x.dispositivo_id || x.mid) === id);
        const nombre = p ? p.nombre : id;
        const url = "/api/alert"; // Antes llamaba directo a Pushcut con token en el frontend. Ahora va al servidor.
        const btn = document.querySelector(`button[onclick="requestGpsUpdate('${id}')"]`);
        const originalText = btn.innerHTML;
        btn.innerHTML = 'â³ ENVIANDO...'; btn.disabled = true;
        
        try {
            await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ device: id, mensaje: 'Solicitar estatus real para ' + nombre }) });
            showAlert(`Orden enviada al servidor para: ${esc(nombre)}`);
        } catch (e) { showAlert("Error al conectar con el servidor"); }
        finally { setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000); }
    }

    function showAlert(msg) {
        const container = document.getElementById('alert-container');
        const box = document.createElement('div');
        box.className = 'alert-box';
        box.innerHTML = `<div style="font-size:9px; font-weight:bold; margin-bottom:4px;">âš ï¸ ALERTA</div><div>${msg}</div>`;
        container.appendChild(box);
        setTimeout(() => { if(box.parentNode) box.parentNode.removeChild(box); }, 6000);
    }

    loadPositions();
    setInterval(loadPositions, 5000);
</script>
</body>
</html>
